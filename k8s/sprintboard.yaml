---
apiVersion: v1
kind: Namespace
metadata:
  name: devops
  labels:
    app.kubernetes.io/part-of: helixon-platform
    sprint: v14886
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sprintboard-api-config
  namespace: devops
  labels:
    app: sprintboard-api
    app.kubernetes.io/part-of: helixon-platform
data:
  owner: argo-cd
  sprint: v14886
  addr: ":9400"
  db_path: "/var/lib/sprintboard/sprintboard.db"
  healthz_path: "/healthz"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sprintboard-data
  namespace: devops
  labels:
    app: sprintboard-api
    app.kubernetes.io/part-of: helixon-platform
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Service
metadata:
  name: sprintboard-api
  namespace: devops
  labels:
    app: sprintboard-api
    app.kubernetes.io/part-of: helixon-platform
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 9400
    targetPort: 9400
    protocol: TCP
  selector:
    app: sprintboard-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprintboard-api
  namespace: devops
  labels:
    app: sprintboard-api
    app.kubernetes.io/part-of: helixon-platform
    sprint: v14886
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sprintboard-api
  template:
    metadata:
      labels:
        app: sprintboard-api
        app.kubernetes.io/part-of: helixon-platform
    spec:
      containers:
      - name: sprintboard-api
        # v14886: distroless decommission. New image under
        # ghcr.io/nfsarch33/sprintboard-api:dev
        image: ghcr.io/nfsarch33/sprintboard-api:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9400
          name: http
        args:
          - -addr=:9400
          - -db=/var/lib/sprintboard/sprintboard.db
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9400
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 9400
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: 9400
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        volumeMounts:
        - name: data
          mountPath: /var/lib/sprintboard
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sprintboard-data
---
# SprintBoard UI (v14886-deliverable): static HTML+JS SPA served
# via nginx. The frontend lives in cmd/sprintboard-ui/.
apiVersion: v1
kind: Service
metadata:
  name: sprintboard-ui
  namespace: devops
  labels:
    app: sprintboard-ui
    app.kubernetes.io/part-of: helixon-platform
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 80
    protocol: TCP
  selector:
    app: sprintboard-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprintboard-ui
  namespace: devops
  labels:
    app: sprintboard-ui
    app.kubernetes.io/part-of: helixon-platform
    sprint: v14886
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sprintboard-ui
  template:
    metadata:
      labels:
        app: sprintboard-ui
        app.kubernetes.io/part-of: helixon-platform
    spec:
      containers:
      - name: sprintboard-ui
        image: ghcr.io/nfsarch33/sprintboard-ui:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 30
          timeoutSeconds: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
