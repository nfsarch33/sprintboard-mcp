name: CI
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# Supersede in-flight runs for the same ref. Without this a burst of pushes to
# main fans out a full run set per commit and the queue fills with results
# nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Pinned to the same version used for local verification so CI and a
      # developer's run cannot disagree about what is a finding. The action's
      # default is a v1 line, which does not understand a `go 1.25.0` directive.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.0

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install build deps
        run: |
          if command -v apk &>/dev/null; then
            apk add --no-cache gcc musl-dev
          fi
      - run: CGO_ENABLED=1 go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Check coverage
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          if [ "$(echo "$total < 70" | bc)" -eq 1 ]; then
            echo "::warning::Coverage ${total}% is below 70% threshold"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          CGO_ENABLED=1 go build -ldflags "-s -w" -o sprintboard-api ./cmd/sprintboard-api/
          CGO_ENABLED=1 go build -ldflags "-s -w" -o sprintboard-mcp ./cmd/sprintboard-mcp/

  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
      - name: gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest && gosec -quiet ./...
