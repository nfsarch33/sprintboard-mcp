name: CI
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

# Supersede in-flight runs for the same ref. Without this a burst of pushes to
# main fans out a full run set per commit and the queue fills with results
# nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Pinned to the version used for local verification so CI and a developer
      # cannot disagree about what counts as a finding. The action's default is
      # a v1 line, which does not understand this module's go directive and
      # would report a toolchain error as if it were a lint verdict.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.0

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install build deps
        run: |
          if command -v apk &>/dev/null; then
            apk add --no-cache gcc musl-dev
          fi
      - run: CGO_ENABLED=1 go test -race -coverprofile=coverage.out -covermode=atomic ./...
      # 75% is the operator standard ("75%+ overall coverage, no exceptions").
      # Raised from 70% in v18789 once the repo actually cleared it -- the
      # threshold follows the code, never the other way round.
      - name: Check coverage
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%"
          if [ "$(echo "$total < 75" | bc)" -eq 1 ]; then
            echo "::error::Coverage ${total}% is below the 75% threshold"
            exit 1
          fi

  # Integration suite. The ginkgo specs in internal/sprintboard carry a
  # `//go:build integration` tag, so `go test ./...` silently skips them --
  # they had never run in GitHub CI. This job is what makes them a gate.
  integration:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Assert the integration tag actually selects specs
        run: |
          # A tagged suite that compiles to zero tests passes vacuously, which
          # is indistinguishable from a green run. Fail if nothing is selected.
          count=$(grep -rl 'go:build integration' --include='*.go' . | wc -l)
          echo "files behind the integration tag: ${count}"
          if [ "$count" -eq 0 ]; then
            echo "::error::no integration-tagged files found; this job would pass vacuously"
            exit 1
          fi
      - run: go test -tags=integration -race -count=1 ./...

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          CGO_ENABLED=1 go build -ldflags "-s -w" -o sprintboard-api ./cmd/sprintboard-api/
          CGO_ENABLED=1 go build -ldflags "-s -w" -o sprintboard-mcp ./cmd/sprintboard-mcp/

  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Both scanners are PINNED, never @latest. A scanner that changes version
      # under a blocking gate turns main red on someone else's release schedule
      # rather than on a change to this repo.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          set +e
          out=$(govulncheck ./... 2>&1); rc=$?
          echo "$out"
          # A govulncheck built against a different Go than the one running
          # `go list` loads ZERO packages and still exits 0 -- a scan that
          # found nothing because it examined nothing. Treat that as a failure.
          if echo "$out" | grep -q 'Loading packages failed'; then
            echo "::error::govulncheck could not load packages; this is a false green, not a clean scan"
            exit 1
          fi
          exit $rc

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -quiet ./...
