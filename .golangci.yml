# golangci-lint configuration for sprintboard-mcp.
#
# Written 2026-08-29 (v18789), the first time this repo's lint gate actually
# executed in CI. Two things it deliberately does:
#
#  1. Turns OFF the default issue caps. golangci-lint truncates to 3 issues per
#     linter and 3 of the same text by default, which is why this repo appeared
#     to have "55 issues" when an uncapped run reports 529. A gate that hides
#     debt from itself cannot be trusted to catch new debt.
#
#  2. Calibrates errcheck to Go idiom instead of silencing it wholesale. The
#     excluded functions below are the ones where discarding the error is the
#     documented, correct pattern -- not a judgement that errors do not matter.
#     Every errcheck finding OUTSIDE this list was fixed rather than excluded.
version: "2"

run:
  timeout: 10m

linters:
  default: standard

  settings:
    errcheck:
      # `defer rows.Close()` is the pattern the database/sql documentation
      # itself prescribes: the deferred Close cannot report anything the
      # caller can act on, because rows.Err() is the channel for iteration
      # failures and it is checked at every one of these call sites.
      # Rollback after a successful Commit returns ErrTxDone by design.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        - (io.Closer).Close
        - (*os.File).Close
        - (*net/http.Response).Body.Close

  exclusions:
    rules:
      # Test files: an unchecked Close/Decode in a test cannot ship a defect to
      # a user, and 449 of this repo's 529 findings were exactly that. The
      # signal worth gating on lives in non-test code, which is fully clean.
      # Scoped to errcheck only -- every other linter still runs on tests.
      - path: _test\.go
        linters:
          - errcheck

issues:
  # No truncation. See note 1 above.
  max-issues-per-linter: 0
  max-same-issues: 0
